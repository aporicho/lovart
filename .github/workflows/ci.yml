name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet and race tests
        run: make check

      - name: Architecture and capture checks
        run: bash scripts/check_architecture.sh

      - name: Build CLI
        run: go build ./cmd/lovart
